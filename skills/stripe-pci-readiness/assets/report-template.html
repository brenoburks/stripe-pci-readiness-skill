<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="icon" href="data:,">
  <title>{{DOCUMENT_TITLE}}</title>
  <style>
    :root {
      --paper: #ffffff;
      --paper-muted: #f3f7f8;
      --ink: #17262c;
      --ink-muted: #526269;
      --rule: #c8d4d8;
      --accent: #24778e;
      --accent-soft: #e4f3f7;
      --critical: #a93832;
      --warning: #9a5b08;
      --positive: #23714f;
      --unknown: #526269;
      --space-1: .25rem;
      --space-2: .5rem;
      --space-3: .75rem;
      --space-4: 1rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-12: 3rem;
      --space-16: 4rem;
      --measure: 72ch;
      --content: 74rem;
      color-scheme: light;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper-muted);
      color: var(--ink);
      font-size: 1rem;
      line-height: 1.6;
    }
    a { color: var(--accent); text-underline-offset: .18em; }
    a:hover { text-decoration-thickness: .14em; }
    a:focus-visible, summary:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }
    .skip-link {
      position: fixed;
      inset: var(--space-4) auto auto var(--space-4);
      z-index: 10;
      transform: translateY(-180%);
      background: var(--ink);
      color: var(--paper);
      padding: var(--space-3) var(--space-4);
    }
    .skip-link:focus { transform: translateY(0); }
    .shell {
      display: grid;
      grid-template-columns: minmax(13rem, 17rem) minmax(0, 1fr);
      gap: clamp(2rem, 5vw, 5rem);
      width: min(calc(100% - 3rem), var(--content));
      margin: 0 auto;
      padding: var(--space-12) 0 var(--space-16);
    }
    .toc {
      position: sticky;
      top: var(--space-8);
      align-self: start;
      border-top: 3px solid var(--ink);
      padding-top: var(--space-4);
    }
    .toc__title, .eyebrow, .meta-label, .section-number, .finding-id, th {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .055em;
      line-height: 1.35;
      text-transform: uppercase;
    }
    .toc ol { list-style: none; margin: var(--space-4) 0 0; padding: 0; }
    .toc li + li { margin-top: var(--space-2); }
    .toc a { color: var(--ink-muted); text-decoration: none; }
    .toc a:hover { color: var(--ink); text-decoration: underline; }
    .document {
      min-width: 0;
      background: var(--paper);
      border-top: .5rem solid var(--ink);
      padding: clamp(1.5rem, 4vw, 4rem);
    }
    .cover { padding-bottom: var(--space-12); border-bottom: 1px solid var(--rule); }
    .eyebrow { color: var(--accent); margin: 0 0 var(--space-4); }
    h1, h2, h3 { margin: 0; text-wrap: balance; }
    h1 {
      max-width: 17ch;
      font-size: clamp(2.25rem, 6vw, 4.5rem);
      font-weight: 750;
      letter-spacing: -.045em;
      line-height: .98;
    }
    h2 { font-size: clamp(1.65rem, 3vw, 2.2rem); letter-spacing: -.025em; line-height: 1.1; }
    h3 { font-size: 1.2rem; letter-spacing: -.012em; line-height: 1.3; }
    p, ul, ol { max-width: var(--measure); }
    .subject { margin: var(--space-6) 0 0; color: var(--ink-muted); font-size: 1.125rem; }
    .report-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-4) var(--space-8);
      margin: var(--space-8) 0 0;
    }
    .report-meta div { border-top: 1px solid var(--rule); padding-top: var(--space-2); }
    .report-meta dt { color: var(--ink-muted); }
    .report-meta dd { margin: var(--space-1) 0 0; overflow-wrap: anywhere; font-weight: 650; }
    section { scroll-margin-top: var(--space-8); padding-top: var(--space-16); }
    .section-heading { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr); gap: var(--space-3); align-items: baseline; margin-bottom: var(--space-8); }
    .section-number { color: var(--accent); }
    .outcome {
      border: 1px solid #a9cbd5;
      border-left: .3rem solid var(--accent);
      border-radius: .25rem;
      background: var(--accent-soft);
      padding: clamp(1.25rem, 3vw, 2rem);
    }
    .outcome__classification { font-size: clamp(1.6rem, 3vw, 2.35rem); font-weight: 730; letter-spacing: -.03em; line-height: 1.12; margin: 0; }
    .outcome-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); margin-top: var(--space-6); }
    .outcome-grid > div { border-top: 1px solid #a9cbd5; padding-top: var(--space-3); }
    .outcome-grid p { margin: var(--space-1) 0 0; }
    .prose-list { padding-left: 1.25rem; }
    .prose-list li + li { margin-top: var(--space-2); }
    .split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-8); }
    .subsection { border-top: 1px solid var(--rule); padding-top: var(--space-4); }
    .flow { list-style: none; padding: 0; margin: 0; }
    .flow li { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr); gap: var(--space-4); padding: var(--space-4) 0; border-top: 1px solid var(--rule); }
    .flow__step { display: grid; place-items: center; width: 2rem; height: 2rem; border: 1px solid var(--accent); color: var(--accent); font-weight: 750; }
    .flow p { margin: var(--space-1) 0; }
    .evidence {
      margin-top: var(--space-3);
      border-radius: .25rem;
      background: var(--paper-muted);
      padding: var(--space-4);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: .82rem;
      overflow-wrap: anywhere;
    }
    .table-wrap { overflow-x: auto; border-top: 2px solid var(--ink); }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { padding: var(--space-3); border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
    th { color: var(--ink-muted); }
    .status {
      display: inline-block;
      border: 1px solid currentColor;
      border-radius: .25rem;
      padding: .18rem .42rem;
      font-size: .72rem;
      font-weight: 750;
      line-height: 1.25;
      white-space: nowrap;
    }
    .status--critical { color: var(--critical); }
    .status--high, .status--medium { color: var(--warning); }
    .status--verified, .status--low, .status--informational { color: var(--positive); }
    .status--unknown { color: var(--unknown); }
    .finding { padding: var(--space-8) 0; border-top: 1px solid var(--rule); break-inside: avoid; }
    .finding:first-of-type { border-top: 2px solid var(--ink); }
    .finding__header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-4); align-items: start; }
    .finding-id { display: block; margin-bottom: var(--space-2); color: var(--accent); }
    .finding__meta { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); color: var(--ink-muted); font-size: .86rem; }
    .finding__body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-6); margin-top: var(--space-6); }
    .finding__body h4 { margin: 0 0 var(--space-2); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
    .finding__body p { margin: 0; }
    .finding__wide { grid-column: 1 / -1; }
    .source-list { padding: 0; list-style: none; }
    .source-list li { padding: var(--space-4) 0; border-top: 1px solid var(--rule); overflow-wrap: anywhere; }
    .source-id { color: var(--ink-muted); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .76rem; }
    .disclaimer { margin-top: var(--space-16); border-top: 3px solid var(--ink); padding-top: var(--space-4); font-weight: 700; }
    .print-note { color: var(--ink-muted); font-size: .82rem; }

    @media (max-width: 820px) {
      html { scroll-behavior: auto; }
      .shell { display: block; width: 100%; padding: 0; }
      .toc { position: static; border-top: 0; border-bottom: 1px solid var(--rule); background: var(--paper); padding: var(--space-4) clamp(1rem, 5vw, 2rem); }
      .toc ol { columns: 2; column-gap: var(--space-6); }
      .document { border-top-width: .35rem; padding: clamp(1rem, 5vw, 2rem); }
      .report-meta, .outcome-grid, .split, .finding__body { grid-template-columns: 1fr; }
      .finding__wide { grid-column: auto; }
    }

    @media (max-width: 560px) {
      body { font-size: 1rem; }
      .toc ol { columns: 1; }
      .report-meta { grid-template-columns: 1fr; }
      .section-heading { grid-template-columns: 2rem minmax(0, 1fr); }
      .finding__header { grid-template-columns: 1fr; }
      .table-wrap { overflow: visible; border-top: 0; }
      table, tbody, tr, td { display: block; width: 100%; }
      thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      tr { border-top: 2px solid var(--ink); padding: var(--space-2) 0; }
      td { display: grid; grid-template-columns: minmax(7.5rem, 38%) minmax(0, 1fr); gap: var(--space-3); border-bottom: 1px solid var(--rule); padding: var(--space-3) 0; }
      td::before { content: attr(data-label); color: var(--ink-muted); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .7rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    }

    @media print {
      @page { size: A4; margin: 16mm 15mm 18mm; }
      :root { --paper-muted: #f2f2f2; --accent: #215e70; --accent-soft: #eef5f6; }
      html, body { background: #fff; font-size: 9.5pt; }
      .skip-link, .toc, .print-note { display: none !important; }
      .shell { display: block; width: 100%; margin: 0; padding: 0; }
      .document { border-top-width: 5pt; padding: 0; }
      .cover { min-height: 85mm; }
      section { padding-top: 12mm; }
      h1 { font-size: 30pt; }
      h2 { font-size: 18pt; }
      h3 { font-size: 12pt; }
      a { color: inherit; text-decoration: underline; }
      .finding, .outcome, .subsection, .flow li, tr { break-inside: avoid; }
      thead { display: table-header-group; }
      .disclaimer { margin-top: 12mm; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-report">Skip to report</a>
  <div class="shell">
    {{TABLE_OF_CONTENTS}}
    <main class="document" id="main-report">
      {{REPORT_CONTENT}}
    </main>
  </div>
</body>
</html>
